<title>Storyworld Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Special+Elite&family=Courier+Prime:wght@400;700&family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Karla:wght@400;500;700&display=swap">
<style>
/* Layout: three-pane writing desk (scenes | manuscript | story world), collapsing to tabs on phones */
:root {
  --bg: #eef1ef; --surface: #ffffff; --sunk: #f6f8f7; --ink: #1c2421; --muted: #5a6560; --line: #d9dfdc;
  --accent: #24566b; --accent-soft: #e2edf1;
  --person: #b0416a; --place: #1d7a6c; --time: #a3660f; --object: #6b4fb3; --group: #4c7a24; --rule: #4b5563;
  --error: #c2362b; --warning: #a8700f; --idea: #2f6fb0;
  --f-book: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1a1f1d; --sunk: #161a19; --ink: #e5ebe8; --muted: #98a39e; --line: #2c3431;
  --accent: #82b8cc; --accent-soft: #1f3138;
  --person: #ec8db0; --place: #5cc4b3; --time: #e3a853; --object: #ab90f2; --group: #9dc96b; --rule: #a7b0bc;
  --error: #f07c71; --warning: #e4b15b; --idea: #82b2ea; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a1f1d; --sunk: #161a19; --ink: #e5ebe8; --muted: #98a39e; --line: #2c3431;
  --accent: #82b8cc; --accent-soft: #1f3138;
  --person: #ec8db0; --place: #5cc4b3; --time: #e3a853; --object: #ab90f2; --group: #9dc96b; --rule: #a7b0bc;
  --error: #f07c71; --warning: #e4b15b; --idea: #82b2ea; color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
.brand { font-family: var(--f-book); font-weight: 600; font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 400; }
#bookTitle { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 8px; font-family: var(--f-book); font-size: 16px; min-width: 0; flex: 1 1 auto; max-width: 420px; }
#bookTitle:hover, #bookTitle:focus { border-color: var(--line); background: var(--sunk); }
.status { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; white-space: nowrap; }
.chip-btn:hover { border-color: var(--accent); }
.sev-count { display: inline-flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

.main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 380px; min-height: 0; }
.pane { min-height: 0; overflow: auto; }
.pane-scenes { border-right: 1px solid var(--line); background: var(--sunk); padding: 14px 12px; }
.pane-panel { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
.pane-write { background: var(--bg); }
.mobile-tabs { display: none; }

/* Scenes */
.side-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 6px 8px; }
.chapter { margin-bottom: 14px; }
.chapter-head { display: flex; align-items: center; gap: 6px; padding: 0 6px; }
.chapter-head input { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; padding: 3px 4px; border-radius: 5px; font-weight: 600; font-size: 13px; }
.chapter-head input:hover, .chapter-head input:focus { border-color: var(--line); background: var(--surface); }
.scene-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 7px; padding: 7px 8px; margin: 2px 0; }
.scene-item:hover { background: var(--surface); border-color: var(--line); }
.scene-item.active { background: var(--surface); border-color: var(--accent); }
.scene-item .t { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scene-item .d { grid-column: 1; font-size: 11.5px; color: var(--muted); }
.scene-item .flags { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 3px; align-items: center; }
.add-link { border: none; background: none; color: var(--accent); font-size: 12.5px; padding: 4px 8px; }
.add-link:hover { text-decoration: underline; }

/* Editor */
.write-wrap { max-width: 760px; margin: 0 auto; padding: 28px 32px 120px; }
.scene-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 6px; color: var(--muted); font-size: 12.5px; }
.scene-meta label { display: inline-flex; align-items: center; gap: 6px; }
.scene-meta input { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 7px; font-size: 12.5px; }
.scene-meta input[type=text] { width: 230px; max-width: 100%; }
#sceneTitle { width: 100%; border: none; background: transparent; font-family: var(--f-book); font-size: 30px; font-weight: 600; letter-spacing: -.01em; padding: 4px 0 10px; text-wrap: balance; }
#sceneTitle:focus { outline: none; }
.time-hint { font-size: 12px; color: var(--muted); font-style: italic; }
.mark-hint { font-size: 12px; color: var(--muted); margin: 0 0 18px; }
.mark-hint kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }
#editor { font-family: var(--f-book); font-size: 19px; line-height: 1.75; min-height: 50vh; outline: none; caret-color: var(--accent); }
#editor p { margin: 0 0 1em; max-width: 66ch; }
#editor:empty::before { content: "Start writing this scene…"; color: var(--muted); }
.mk { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--mk, var(--accent)); background: color-mix(in srgb, var(--mk, var(--accent)) 9%, transparent); border-radius: 2px; cursor: pointer; }
.mk.multi { text-decoration-style: double; }
.marks-off .mk { text-decoration: none; background: none; }
.mk.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--mk, var(--accent)) 45%, transparent); } }
@media (prefers-reduced-motion: reduce) { .mk.flash { animation: none; } }

/* Floating mark UI */
#markBtn { position: fixed; z-index: 30; border: none; border-radius: 999px; background: var(--ink); color: var(--surface); padding: 6px 12px; font-size: 12.5px; font-weight: 500; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.pop { position: fixed; z-index: 40; width: 300px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 10px; }
.pop input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--sunk); }
.pop .opts { max-height: 220px; overflow: auto; margin: 8px 0; }
.pop .opt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: none; padding: 6px 8px; border-radius: 6px; }
.pop .opt:hover, .pop .opt.sel { background: var(--accent-soft); }
.pop .opt small { color: var(--muted); margin-left: auto; }
.pop .create { border-top: 1px solid var(--line); padding-top: 8px; font-size: 12.5px; color: var(--muted); }
.type-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.type-chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 9px; font-size: 12.5px; }
.type-chip:hover { border-color: var(--ink); }

/* Panel */
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; flex: none; overflow-x: auto; }
.tab { border: none; background: none; padding: 12px 10px 10px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.panel-body { overflow: auto; padding: 16px; flex: 1; min-height: 0; }
.sec { margin-bottom: 22px; }
.sec h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.el-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 8px; background: var(--surface); font-size: 13px; margin: 0 4px 6px 0; }
.el-chip:hover { border-color: var(--ink); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.trait { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; background: var(--surface); }
.trait .row1 { display: flex; align-items: center; gap: 8px; }
.trait .row1 b { font-weight: 600; }
.badge { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
.badge.hard { color: var(--error); } .badge.soft { color: var(--warning); } .badge.knowledge { color: var(--idea); }
.trait .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.x { margin-left: auto; border: none; background: none; color: var(--muted); padding: 2px 6px; border-radius: 5px; }
.x:hover { color: var(--error); background: var(--sunk); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 12px; font-size: 13px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--sunk); border-radius: 7px; padding: 7px 9px; width: 100%; }
.field textarea { resize: vertical; min-height: 64px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 10px; }
.form-box { border: 1px dashed var(--line); border-radius: 9px; padding: 12px; margin-top: 8px; background: var(--sunk); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.two > * { min-width: 0; }

.issue { display: grid; grid-template-columns: 4px 1fr; gap: 0 12px; padding: 10px 10px 10px 0; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--surface); overflow: hidden; }
.issue .stripe { border-radius: 0 3px 3px 0; }
.issue.error .stripe { background: var(--error); } .issue.warning .stripe { background: var(--warning); } .issue.idea .stripe { background: var(--idea); }
.issue .head { display: flex; gap: 8px; align-items: baseline; }
.issue .title { font-weight: 600; }
.issue .src { margin-left: auto; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.issue .detail { margin: 4px 0 8px; color: var(--ink); line-height: 1.45; }
.issue .where { font-size: 12px; color: var(--muted); }
.issue .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.issue .acts button { font-size: 12px; padding: 4px 9px; }
.issue blockquote { margin: 6px 0; padding-left: 10px; border-left: 2px solid var(--line); font-family: var(--f-book); font-style: italic; color: var(--muted); }
.sev-head { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 14px 0 8px; }
.sev-head:first-child { margin-top: 0; }

.el-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 8px; border-radius: 7px; }
.el-row:hover { background: var(--sunk); }
.el-row .n { font-weight: 500; }
.el-row .c { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.dossier-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dossier-name { font-family: var(--f-book); font-size: 24px; font-weight: 600; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 6px; width: 100%; min-width: 0; }
.dossier-name:hover, .dossier-name:focus { border-color: var(--line); background: var(--sunk); }
.summary { font-family: var(--f-book); font-size: 15px; line-height: 1.6; background: var(--sunk); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; }
.appear { border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 10px; }
.appear button { border: none; background: none; padding: 0; color: var(--accent); font-size: 12px; }
.appear p { margin: 3px 0 0; font-family: var(--f-book); font-size: 14px; line-height: 1.5; }
.appear mark { background: color-mix(in srgb, var(--mk, var(--accent)) 18%, transparent); color: inherit; border-radius: 2px; }
.link-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.link-row .rel { color: var(--muted); font-style: italic; }
.answer { font-family: var(--f-book); font-size: 15px; line-height: 1.6; white-space: pre-wrap; margin-top: 12px; }
.media-card { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; border: 1px solid var(--line); border-radius: 9px; padding: 10px; margin-bottom: 10px; background: var(--surface); }
.media-thumb { width: 104px; height: 104px; border-radius: 6px; overflow: hidden; background: var(--sunk); display: grid; place-items: center; text-align: center; font-size: 11.5px; color: var(--muted); padding: 0; border: none; }
.media-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.media-body { display: grid; gap: 6px; min-width: 0; }
.media-body input, .media-body textarea, .media-body select { width: 100%; border: 1px solid var(--line); background: var(--sunk); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
.media-body textarea { min-height: 70px; resize: vertical; font-family: var(--f-book); font-size: 14px; line-height: 1.5; }
.media-tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.media-tags .el-chip { margin: 0; font-size: 12px; padding: 2px 4px 2px 8px; }
.media-tags .el-chip .x { padding: 0 4px; margin-left: 2px; }
.detail-list { display: flex; flex-wrap: wrap; gap: 4px; }
.detail-list span { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; background: var(--accent-soft); color: var(--ink); }
.media-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.media-acts .btn { font-size: 12px; padding: 4px 9px; }
.scene-media { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
.sm-item { margin: 0; width: 104px; position: relative; }
.sm-photo { width: 100%; height: 78px; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--sunk); cursor: zoom-in; display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.sm-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sm-photo span { padding: 6px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.sm-item figcaption { font-size: 11.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.portrait { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; padding: 0; border: 2px solid var(--mk); flex: none; cursor: zoom-in; background: var(--sunk); }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-count { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.img-count svg { width: 12px; height: 12px; }
.bible-wrap { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.bible-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.bible-scroll { flex: 1; overflow: auto; padding: 24px 16px 60px; }
#biblePage { max-width: 860px; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
.bible .b-edit { width: 100%; font: inherit; color: inherit; background: #fbfaf6; border: 1px dashed #c9c2b0; border-radius: 4px; padding: 8px 10px; resize: vertical; min-height: 3.2em; }
.bible .b-edit:focus { outline: 2px solid #24566b; border-color: transparent; }
.lightbox { position: fixed; inset: 0; z-index: 65; background: rgba(0,0,0,.8); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
@media (max-width: 420px) { .media-card { grid-template-columns: 1fr; } .media-thumb { width: 100%; height: 180px; } }

.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 9px; padding: 10px 14px; margin-bottom: 22px; font-size: 13px; }
.banner b { font-weight: 600; }
.confirm { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 16px; }
.confirm .box { background: var(--surface); border-radius: 12px; padding: 18px; max-width: 380px; width: 100%; border: 1px solid var(--line); }
.confirm h4 { margin: 0 0 6px; font-size: 16px; }
.confirm p { margin: 0 0 16px; color: var(--muted); line-height: 1.45; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 70; max-width: calc(100vw - 32px); }

/* Type colours */
.t-person { --mk: var(--person); } .t-place { --mk: var(--place); } .t-time { --mk: var(--time); }
.t-object { --mk: var(--object); } .t-group { --mk: var(--group); } .t-rule { --mk: var(--rule); }
.tdot { width: 9px; height: 9px; border-radius: 50%; background: var(--mk); flex: none; display: inline-block; }

@media (max-width: 1100px) { .main { grid-template-columns: 220px minmax(0, 1fr) 330px; } .write-wrap { padding: 22px 22px 100px; } }
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .pane-scenes, .pane-panel, .pane-write { display: none; border: none; }
  .app[data-view="scenes"] .pane-scenes, .app[data-view="write"] .pane-write { display: block; }
  .app[data-view="world"] .pane-panel { display: flex; }
  .app { grid-template-rows: auto auto 1fr; }
  .mobile-tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); }
  .mobile-tabs button { flex: 1; border: none; background: none; padding: 10px 4px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
  .mobile-tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .write-wrap { padding: 18px 16px 100px; }
  #sceneTitle { font-size: 24px; }
  #editor { font-size: 17.5px; }
  .brand span, .status, .skin-pick span { display: none; }
  header.top { gap: 8px; }
}
.skin-pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.skin-pick select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 8px; font-size: 13px; }

/* =====================================================================
   SKIN: TYPEWRITER — typed pages on a green felt desk mat, label-tape scenes,
   a manila folder of sticky notes, highlighter marks, typewriter-key buttons.
   A single deliberate look in both themes.
   ===================================================================== */
:root[data-skin="typewriter"] {
  --bg: #43513f; --surface: #fbfaf4; --sunk: #f2efe4; --ink: #1f1d1a; --muted: #6b665c; --line: #d6d0c0;
  --accent: #b3261e; --accent-soft: #f6e1dc;
  --person: #ff6fa8; --place: #45c993; --time: #ffbf2e; --object: #a58cff; --group: #92cc55; --rule: #98a3ae;
  --error: #c0392b; --warning: #a8700f; --idea: #2f6fb0;
  --felt-text: #ece6d4; --manila: #f3e3b3; --manila-tab: #e4cf92;
  --f-book: "Special Elite", "Courier Prime", "Courier New", monospace;
  --f-ui: "Courier Prime", "Courier New", ui-monospace, monospace;
  --f-hand: "Caveat", "Comic Sans MS", cursive;
  color-scheme: light;
}

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const TYPES = {
  person: { label: 'Person' }, place: { label: 'Place' }, time: { label: 'Time' },
  object: { label: 'Object' }, group: { label: 'Group' }, rule: { label: 'Rule' },
};
const KINDS = { hard: 'Hard', soft: 'Soft', knowledge: 'Knowledge' };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = p => p + Math.random().toString(36).slice(2, 9);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-').map(Number); return `${dd} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].at(m - 1)} ${y}`; };

/* ---------- sample story ---------- */
function sampleStory() {
  const mk = (id, t) => `<span class="mk" data-el="${id}">${t}</span>`;
  const ch1 = 'c1', ch2 = 'c2';
  const scenes = {
    s1: { id: 's1', chapterId: ch1, title: 'The cliffs', date: '1921-03-02', note: 'Ten days before the Flood',
      html: `<p>${mk('e_mara', 'Mara')} never went near ${mk('e_cliffs', 'the cliffs')}; heights turned her legs to water. From the harbour she could see ${mk('e_lh', 'the lighthouse')}, white against the rain.</p><p>Her brother ${mk('e_jon', 'Jon')} was leaving for ${mk('e_vienna', 'Vienna')} in the morning, and he had promised to write every week.</p>` },
    s2: { id: 's2', chapterId: ch1, title: 'The Flood', date: '1921-03-12', note: '',
      html: `<p>When ${mk('e_flood', 'the Flood')} came, the sea took the lower town in a single night. Afterwards the harbour master had the door of ${mk('e_lh', 'the lighthouse')} bricked up, so that no one would try the stairs again.</p><p>${mk('e_mara', 'Mara')} watched from the church steps. She had kept ${mk('e_key', 'the brass key')} anyway.</p>` },
    s3: { id: 's3', chapterId: ch2, title: 'Letters from Vienna', date: '1921-04-03', note: '',
      html: `<p>In ${mk('e_vienna', 'Vienna')}, ${mk('e_jon', 'Jon')} sat in a cold room above a bakery and wrote to his sister for the third time that week. The trams rang below the window all night.</p>` },
    s4: { id: 's4', chapterId: ch2, title: 'The lamp room', date: '1921-04-03', note: 'Night of the storm',
      html: `<p>On the night of the storm, ${mk('e_mara', 'Mara')} slipped inside ${mk('e_lh', 'the lighthouse')} and ran up the stairs to the lamp room. ${mk('e_jon', 'Jon')} was beside her, holding the lantern.</p><p>Below them the water rose over the rocks. Mara thought of the Flood and did not look down.</p>` },
  };
  const world = {
    elements: [
      { id: 'e_mara', type: 'person', name: 'Mara', aliases: ['Mara Lind'], notes: "The lighthouse keeper's daughter, 19 in 1921.",
        traits: [
          { id: 't1', name: 'Fear of heights', kind: 'soft', words: ['climb', 'climbed', 'climbing', 'ran up', 'stairs', 'ladder', 'tower', 'roof'], absent: false, from: '', until: '' },
          { id: 't2', name: "Can't swim", kind: 'hard', words: ['swim', 'swam', 'swimming', 'dived'], absent: false, from: '', until: '' },
        ] },
      { id: 'e_jon', type: 'person', name: 'Jon', aliases: [], notes: "Mara's older brother.", traits: [] },
      { id: 'e_lh', type: 'place', name: 'Lighthouse', aliases: ['the lighthouse'], notes: 'On the north rocks, reached by a causeway.',
        traits: [ { id: 't3', name: 'Sealed: door bricked up', kind: 'hard', words: [], absent: true, from: 's2', until: '' } ] },
      { id: 'e_cliffs', type: 'place', name: 'The cliffs', aliases: [], notes: '', traits: [] },
      { id: 'e_vienna', type: 'place', name: 'Vienna', aliases: [], notes: 'Two days from the coast by train.',
        traits: [ { id: 't4', name: 'Far away: two days by train', kind: 'soft', words: [], absent: false, from: '', until: '' } ] },
      { id: 'e_flood', type: 'time', name: 'The Flood', aliases: [], notes: 'Night of 12 March 1921.', traits: [] },
      { id: 'e_key', type: 'object', name: 'Brass key', aliases: ['the brass key'], notes: 'Opens the old lighthouse door.', traits: [] },
    ],
    links: [
      { id: 'l1', a: 'e_mara', rel: 'sister of', b: 'e_jon', during: '' },
      { id: 'l2', a: 'e_jon', rel: 'moves to', b: 'e_vienna', during: '' },
      { id: 'l3', a: 'e_lh', rel: 'sealed after', b: 'e_flood', during: '' },
      { id: 'l4', a: 'e_mara', rel: 'keeps', b: 'e_key', during: 'e_flood' },
    ],
    dismissed: {},
  };
  return {
    book: { title: 'The Lamp Room', chapters: [{ id: ch1, title: 'Before' }, { id: ch2, title: 'After' }], sceneOrder: ['s1', 's2', 's3', 's4'] },
    scenes, world,
  };
}
function blankStory() {
  const c = newId('c'), s = newId('s');
  return {
    book: { title: 'Untitled novel', chapters: [{ id: c, title: 'Chapter one' }], sceneOrder: [s] },
    scenes: { [s]: { id: s, chapterId: c, title: 'Opening', date: '', note: '', html: '' } },
    world: { elements: [], links: [], dismissed: {} },
  };
}

/* ---------- state ---------- */
let S = null;               // {book, scenes, world}
let cur = null;             // current scene id
let ui = { tab: 'issues', dossier: null, adding: null, filter: '', askText: '', askAnswer: '', askBusy: false };
let isDemo = false;

/* ---------- storage ---------- */
const store = { mode: 'memory', db: null, uid: null, queues: {}, timers: {} };
function setStatus(t) { $('#status').textContent = t; }
async function withTimeout(p, ms) { let t; return Promise.race([p, new Promise(r => { t = setTimeout(() => r(null), ms); })]).finally(() => clearTimeout(t)); }

async function initStore() {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const db = await withTimeout(window.claude.use('db'), 10000);
      const user = db ? await withTimeout(window.claude.use('user'), 10000) : null;
      const uid = user ? await user.id() : null;
      if (db && uid) { store.mode = 'db'; store.db = db; store.uid = uid; return; }
    }
  } catch (e) { /* fall through */ }
  store.mode = 'local';
}
const novelPath = () => `data/users/${store.uid}/novel`;
const scenePath = id => `data/users/${store.uid}/novel/scenes/${id}`;

async function loadData() {
  if (store.mode === 'db') {
    try {
      const snap = await store.db.doc(novelPath()).get();
      if (snap.exists) {
        const d = snap.data();
        const qs = await store.db.collection(`data/users/${store.uid}/novel/scenes`).get();
        const scenes = {};
        qs.docs.forEach(x => { const v = x.data(); if (v && v.id) scenes[v.id] = { ...v }; });
        return { book: structuredClone(d.book), world: structuredClone(d.world), scenes };
      }
      return null;
    } catch (e) { toast("Couldn't load your book. Showing the sample story."); return null; }
  }
  try { const raw = localStorage.getItem('storyworld.v1'); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}

function enqueue(key, fn) {
  const prev = store.queues[key] || Promise.resolve();
  const next = prev.then(fn).then(() => { if (!pendingWrites()) setStatus(savedLabel()); })
    .catch(e => setStatus("Couldn't save: " + (e && e.message ? e.message : 'unknown error')));
  store.queues[key] = next;
  return next;
}
function pendingWrites() { return Object.keys(store.timers).length > 0; }
function savedLabel() { return store.mode === 'db' ? 'Saved' : 'Saved in this browser only'; }

function schedule(key, fn, ms = 900) {
  if (isDemo) { adoptDemo(); return; }
  setStatus('Saving…');
  clearTimeout(store.timers[key]);
  store.timers[key] = setTimeout(() => { delete store.timers[key]; enqueue(key, fn); }, ms);
}
function persistNovel() {
  schedule('novel', async () => {
    if (store.mode === 'db') await store.db.doc(novelPath()).set({ v: 1, book: S.book, world: S.world });
    else saveLocal();
  });
}
function persistScene(id) {
  schedule('scene:' + id, async () => {
    const sc = S.scenes[id]; if (!sc) return;
    if (store.mode === 'db') await store.db.doc(scenePath(id)).set(sc);
    else saveLocal();
  });
}
function removeScene(id) {
  if (isDemo) return;
  enqueue('scene:' + id, async () => { if (store.mode === 'db') await store.db.doc(scenePath(id)).delete(); else saveLocal(); });
}
function saveLocal() { try { localStorage.setItem('storyworld.v1', JSON.stringify(S)); } catch (e) { setStatus("Couldn't save in this browser"); } }
async function persistAll(oldSceneIds = []) {
  setStatus('Saving…');
  if (store.mode === 'db') {
    await enqueue('novel', () => store.db.doc(novelPath()).set({ v: 1, book: S.book, world: S.world }));
    for (const id of Object.keys(S.scenes)) await enqueue('scene:' + id, () => store.db.doc(scenePath(id)).set(S.scenes[id]));
    for (const id of oldSceneIds) if (!S.scenes[id]) await enqueue('scene:' + id, () => store.db.doc(scenePath(id)).delete());
  } else { saveLocal(); setStatus(savedLabel()); }
}
function adoptDemo() {
  isDemo = false; renderBanner();
  if (store.mode === 'memory') return; // still connecting; boot saves it
  persistAll().then(() => toast('Your copy of the sample is saved. Keep editing.'));
}

/* ---------- html cleaning ---------- */
function cleanHTML(html) {
  const src = document.createElement('div'); src.innerHTML = html || '';
  const out = document.createElement('div');
  const walk = (from, to) => {
    for (const n of [...from.childNodes]) {
      if (n.nodeType === 3) { to.appendChild(document.createTextNode(n.data)); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName;
      if (tag === 'P' || tag === 'DIV') {
        if (to === out) { const p = document.createElement('p'); walk(n, p); if (p.textContent.trim() || p.querySelector('br')) out.appendChild(p); }
        else { walk(n, to); }
      } else if (tag === 'BR') { to.appendChild(document.createElement('br')); }
      else if (tag === 'SPAN' && n.classList.contains('mk') && n.dataset.el) {
        const s = document.createElement('span'); s.className = 'mk'; s.dataset.el = n.dataset.el; walk(n, s); if (s.textContent) to.appendChild(s);
      } else if (['B', 'STRONG', 'I', 'EM'].includes(tag)) { const e = document.createElement(tag.toLowerCase()); walk(n, e); to.appendChild(e); }
      else walk(n, to);
    }
  };
  walk(src, out);
  // wrap stray top-level inline content into paragraphs
  const final = document.createElement('div'); let p = null;
  for (const n of [...out.childNodes]) {
    if (n.nodeType === 1 && n.tagName === 'P') { p = null; final.appendChild(n); }
    else { if (!p) { p = document.createElement('p'); final.appendChild(p); } p.appendChild(n); }
  }
  [...final.querySelectorAll('p')].forEach(x => { if (!x.textContent.trim() && !x.querySelector('br')) x.remove(); });
  return final.innerHTML;
}

/* ---------- analysis ---------- */
const elById = id => S.world.elements.find(e => e.id === id);
function sceneList() { return S.book.sceneOrder.map(id => S.scenes[id]).filter(Boolean); }
function sceneLabel(id) {
  const sc = S.scenes[id]; if (!sc) return 'Unknown scene';
  const ci = S.book.chapters.findIndex(c => c.id === sc.chapterId);
  return `Ch ${ci + 1} · ${sc.title || 'Untitled'}`;
}
function storyKeys() {
  const keys = {}; let last = '';
  sceneList().forEach((sc, i) => { if (sc.date) { last = sc.date; keys[sc.id] = { key: sc.date, approx: false, idx: i }; } else keys[sc.id] = { key: last, approx: true, idx: i }; });
  return keys;
}
function cmpScenes(a, b, K) {
  const A = K[a], B = K[b]; if (!A || !B) return 0;
  if (A.key && B.key && A.key !== B.key) return A.key < B.key ? -1 : 1;
  return A.idx - B.idx;
}
function inWindow(t, sid, K) {
  if (t.from && S.scenes[t.from] && cmpScenes(sid, t.from, K) <= 0) return false;
  if (t.until && S.scenes[t.until] && cmpScenes(sid, t.until, K) > 0) return false;
  return true;
}
const anaCache = new Map();
function analyze(sc) {
  const hit = anaCache.get(sc.id); if (hit && hit.html === sc.html) return hit.a;
  const div = document.createElement('div'); div.innerHTML = sc.html || '';
  let paras = [...div.querySelectorAll('p')]; if (!paras.length) paras = [div];
  const a = { paras: [], present: new Set(), words: 0 };
  paras.forEach(p => {
    const ids = new Set();
    p.querySelectorAll('.mk').forEach(s => s.dataset.el.split(',').forEach(x => { ids.add(x); a.present.add(x); }));
    const clone = p.cloneNode(true); clone.querySelectorAll('.mk').forEach(s => s.replaceWith(document.createTextNode(' ¦ ')));
    const text = p.textContent;
    a.words += (text.match(/\S+/g) || []).length;
    a.paras.push({ text, html: p.innerHTML, ids, unmarked: clone.textContent });
  });
  anaCache.set(sc.id, { html: sc.html, a });
  return a;
}
function termsFor(el) { return [el.name, ...(el.aliases || [])].map(s => (s || '').trim()).filter(s => s.length >= 3); }
function termRegex(terms) {
  if (!terms.length) return null;
  const alt = [...terms].sort((a, b) => b.length - a.length).map(reEsc).join('|');
  return new RegExp(`(?<![\\p{L}\\p{N}])(?:${alt})(?![\\p{L}\\p{N}])`, 'iu');
}
function wordRegex(w) { return new RegExp(`(?<![\\p{L}\\p{N}])${reEsc(w.trim())}(?![\\p{L}\\p{N}])`, 'iu'); }

/* ---------- rule engine ---------- */
function hashKey(k) { let h = 5381; for (let i = 0; i < k.length; i++) h = ((h << 5) + h + k.charCodeAt(i)) | 0; return 'i' + (h >>> 0).toString(36); }
function computeIssues() {
  const out = []; const K = storyKeys(); const scenes = sceneList();
  const A = {}; scenes.forEach(sc => { A[sc.id] = analyze(sc); });
  const add = o => { o.id = hashKey(o.key); if (!S.world.dismissed[o.id]) out.push(o); };

  for (const el of S.world.elements) {
    for (const t of el.traits || []) {
      for (const sc of scenes) {
        const a = A[sc.id]; if (!a.present.has(el.id) || !inWindow(t, sc.id, K)) continue;

              title: el.type === 'place' ? `${who.join(' and ') || 'Someone'} at ${el.name}, which is “${t.name}”` : `${el.name} appears while “${t.name}”`,

      .map(sc => ({ sc, places: [...A[sc.id].present].map(elById).filter(e => e && e.type === 'place').map(e => e.id) }))

async function addMediaFiles(files, target) {
  const list = [...files].filter(f => /^image\/(jpeg|png|webp|gif)$/.test(f.type));
  if (!list.length) { toast('Choose a JPEG, PNG, WebP or GIF image.'); return; }
  const assets = await getAssets();
  if (!assets) toast("Image storage isn't available in this view. Descriptions are kept, the images are not.");
  const added = [];
  for (const f of list) {
    const rec = { id: newId('m'), assetId: '', url: '', name: f.name, caption: '', description: '', details: [], elIds: target.elId ? [target.elId] : [], sceneId: target.sceneId || '', at: Date.now() };
    blobCache.set(rec.id, f); objUrls.set(rec.id, URL.createObjectURL(f));
    if (assets) {
      try { const r = await assets.upload(f); rec.assetId = r.id; rec.url = r.url; }
      catch (e) { toast(e?.code === 'not_granted' ? 'Only editors can store images here. The description will still be kept.' : `Couldn't store ${f.name}. The description will still be kept.`); }
    }
    S.world.media.push(rec); added.push(rec);
  }
  persistNovel(); renderPanel(); renderScenes();
  for (const rec of added) await describeMedia(rec.id, true);
}
async function describeMedia(mid, auto) {
  const m = S.world.media.find(x => x.id === mid); if (!m) return;
  const sample = await getSample();
  if (!sample) { if (!auto) toast("AI isn't available in this view."); return; }
  const lim = await sample.limits().catch(() => null);
  if (!lim?.images) { if (!auto) toast("This view can't send images to Claude."); return; }
  let blob = blobCache.get(mid);
  if (!blob && imgSrc(m)) { try { const r = await fetch(imgSrc(m)); if (r.ok) blob = await r.blob(); } catch (e) {} }
  if (!blob) { toast('The image file is not available. Add it again to describe it.'); return; }
  const els = m.elIds.map(elById).filter(Boolean);
  const sc = m.sceneId && S.scenes[m.sceneId];
  const about = els.length ? ` It is a reference picture for ${els.map(e => `the ${TYPES[e.type].label.toLowerCase()} "${e.name}"`).join(' and ')}.` : '';
  const prompt = `A novelist attached this image to their story world.${about}${sc ? ` It belongs to the scene "${sceneLabel(sc.id)}".` : ''}${m.caption ? ` Their caption: "${m.caption}".` : ''}\n\nDescribe only what is visible, the way a novelist would want it for continuity: for people, apparent age range, build, hair, clothing, posture, expression and what they are doing; for places, the setting, objects, era clues, weather, light and mood. Be concrete and plain. Never say who a real person is or guess a name from their face; refer to people by appearance (or by the story element name given above).\n\nReply with only JSON: {"description":"2 to 3 sentences, e.g. A teenage boy with red hair, wearing a white shirt, sits on a bike; behind him is a gas station.","details":["4 to 8 short facts, e.g. red hair","white shirt","gas station in the background"]}. Write in the same language as this sample of the manuscript: "${manuscriptText(600).replace(/\s+/g, ' ').slice(0, 300)}".`;
  describing.add(mid); renderPanel();
  try {
    const res = await sample.json(prompt, { images: [blob], modelTier: 'default' });
    m.description = String(res?.description || '').trim();
    m.details = Array.isArray(res?.details) ? res.details.map(String).map(x => x.trim()).filter(Boolean).slice(0, 10) : [];
    m.aiAt = Date.now(); persistNovel();
  } catch (e) {
    toast(e?.code === 'not_granted' ? 'Image access for Claude was not allowed.' : e?.code === 'image_rejected' ? 'Claude could not read this image file.' : e?.code === 'rate_limited' ? 'Too many AI requests. Try again in a minute.' : "The description didn't finish. Try again.");
  } finally { describing.delete(mid); renderPanel(); }
}
async function removeMedia(mid) {
  const m = S.world.media.find(x => x.id === mid); if (!m) return;
  if (m.assetId) { const assets = await getAssets(); if (assets) { try { await assets.delete(m.assetId); } catch (e) { /* keep going: the record is removed either way */ } } }
  S.world.media = S.world.media.filter(x => x.id !== mid);
  if (objUrls.has(mid)) URL.revokeObjectURL(objUrls.get(mid));
  objUrls.delete(mid); blobCache.delete(mid); persistNovel(); renderPanel(); renderScenes();
}

function canonText() {
  const lines = S.world.elements.map(e => {
    const tr = (e.traits || []).map(t => `    - trait (${t.kind}${t.absent ? ', cannot be present' : ''}): ${t.name}${t.from ? '; after ' + sceneLabel(t.from) : ''}${t.until ? '; until ' + sceneLabel(t.until) : ''}`).join('\n');
    const im = (S.world.media || []).filter(m => m.elIds.includes(e.id) && m.description).map(m => `    - reference image${m.caption ? ' "' + m.caption + '"' : ''}: ${m.description}`).join('\n');
    return `- ${TYPES[e.type].label}: ${e.name}${e.aliases?.length ? ' (also: ' + e.aliases.join(', ') + ')' : ''}${e.notes ? '\n    notes (planned canon): ' + e.notes : ''}${tr ? '\n' + tr : ''}${im ? '\n' + im : ''}`;
  });
  const links = S.world.links.map(l => { const A = elById(l.a), B = elById(l.b), D = elById(l.during); return A && B ? `- ${A.name} ${l.rel} ${B.name}${D ? ' during ' + D.name : ''}` : ''; }).filter(Boolean);

function manuscriptText(limit = 90000) {

    const ims = (S.world.media || []).filter(m => m.sceneId === sc.id && m.description).map(m => `\n[scene image${m.caption ? ' "' + m.caption + '"' : ''}: ${m.description}]`).join('');

      const ms = elMedia(e.id); const pic = ms.map(img).find(Boolean);
      const looks = ms.filter(m => m.description);
      const links = S.world.links.filter(l => l.a === e.id || l.b === e.id).map(l => { const A2 = elById(l.a), B2 = elById(l.b), D = elById(l.during); return A2 && B2 ? `<li>${esc(A2.name)} <i>${esc(l.rel)}</i> ${esc(B2.name)}${D ? ' <i>during</i> ' + esc(D.name) : ''}</li>` : ''; }).join('');
      const app = appearsIn(e.id);
      const summary = e.summary || e.notes || '';
      return `<div class="b-card ${big ? '' : 'b-small'}" id="el-${e.id}">${pic ? `<img class="b-pic" src="${pic}" alt="${esc(e.name)}">` : `<div class="b-noimg" style="background:${TYPE_HEX[e.type]}">${esc((e.name.replace(/^the\s+/i, '')[0] || '?').toUpperCase())}</div>`}<div>
<h3>${esc(e.name)}</h3>${e.aliases?.length ? `<div class="b-aka">Also: ${esc(e.aliases.join(', '))}</div>` : ''}
${summary ? `<p>${esc(summary).replace(/\n+/g, '</p><p>')}</p>` : ''}
${e.summary && e.notes ? `<h4>Author's notes</h4><p>${esc(e.notes).replace(/\n+/g, '</p><p>')}</p>` : ''}
${b.arcs[e.id] ? `<h4>Arc</h4><p>${esc(b.arcs[e.id])}</p>` : ''}
${looks.length ? `<h4>${type === 'person' ? 'Appearance' : 'Look'}</h4>${looks.map(m => `<p>${esc(m.description)}</p>${m.details?.length ? `<ul class="b-tags">${m.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}`).join('')}` : ''}
${(e.traits || []).length ? `<h4>Rules and limits</h4><table><tr><th>Kind</th><th>Trait</th><th>Applies</th></tr>${e.traits.map(t => `<tr><td>${kind(t)}</td><td>${esc(t.name)}${t.absent ? ' <span class="b-note">(cannot be present)</span>' : ''}</td><td class="b-note">${window_(t)}</td></tr>`).join('')}</table>` : ''}
${links ? `<h4>Relationships</h4><ul class="b-tags">${links}</ul>` : ''}
<h4>Appears in</h4><p class="b-note">${app.length ? app.map(sc => esc(sceneLabel(sc.id))).join(' · ') : 'Not yet in the manuscript (planned).'}</p>
</div></div>`;
    }).join('');
    sec(type, title, body);
  }

  // timeline
  const ordered = [...scenes].sort((x, y) => cmpScenes(x.id, y.id, K));
  const tl = `<table><tr><th>Story date</th><th>Scene</th><th>Where</th><th>Who</th></tr>${ordered.map(sc => { const pr = [...A[sc.id].present].map(elById).filter(Boolean); const k = K[sc.id];
    return `<tr><td class="b-num">${sc.date ? esc(fmtDate(sc.date)) : k.key ? '≈ ' + esc(fmtDate(k.key)) : 'Undated'}${sc.note ? `<div class="b-note">${esc(sc.note)}</div>` : ''}</td><td>${esc(sceneLabel(sc.id))}</td><td>${esc(pr.filter(e => e.type === 'place').map(e => e.name).join(', ')) || '<span class="b-note">–</span>'}</td><td>${esc(pr.filter(e => e.type === 'person').map(e => e.name).join(', ')) || '<span class="b-note">–</span>'}</td></tr>`; }).join('')}</table><p class="b-note">Ordered by story time; reading order breaks ties. “≈” marks scenes placed after the previous dated scene.</p>`;
  sec('timeline', 'Timeline', tl);

  // breakdown
  let bd = '';
  S.book.chapters.forEach((c, ci) => {
    const cs = scenes.filter(sc => sc.chapterId === c.id); if (!cs.length) return;
    bd += `<div class="b-chapter">${ci + 1}. ${esc(c.title)}</div>`;
    cs.forEach(sc => { const pr = [...A[sc.id].present].map(elById).filter(Boolean); const ms = (S.world.media || []).filter(m => m.sceneId === sc.id);
      bd += `<div class="b-scene"><div class="b-title">${esc(sc.title || 'Untitled')}</div><div class="b-note">${sc.date ? esc(fmtDate(sc.date)) : 'Undated'}${sc.note ? ' · ' + esc(sc.note) : ''} · ${A[sc.id].words} words</div><p style="margin-top:8px">${esc(sceneSynopsis(sc))}</p>${pr.length ? `<ul class="b-tags">${pr.map(e => `<li>${esc(e.name)}</li>`).join('')}</ul>` : ''}${ms.length ? `<div class="b-thumbs">${ms.map(m => img(m) ? `<figure><img src="${img(m)}" alt="${esc(m.caption || 'Scene image')}">${esc(m.caption || '')}</figure>` : (m.description ? `<figure>${esc(m.caption ? m.caption + ': ' : '')}${esc(m.description)}</figure>` : '')).join('')}</div>` : ''}</div>`; });
  });
  sec('breakdown', 'Chapter and scene breakdown', bd);

  // continuity
  const open = ISSUES.filter(i => i.sev !== 'idea');
  const planned = S.world.elements.filter(e => !scenes.some(sc => A[sc.id].present.has(e.id)));
  const cont = `${open.length ? `<h4>Open continuity issues</h4>${open.map(i => `<div class="b-issue b-${i.sev}"><b>${esc(i.title)}</b>${i.scene ? ` <span class="b-note">${esc(sceneLabel(i.scene))}</span>` : ''}<div>${esc(i.detail || '')}</div></div>`).join('')}` : '<p>No open continuity errors or warnings.</p>'}
${Object.keys(S.world.dismissed).length ? `<p class="b-note">${Object.keys(S.world.dismissed).length} issue(s) marked intentional or dismissed by the author.</p>` : ''}
${planned.length ? `<h4>Planned, not yet in the text</h4><ul class="b-tags">${planned.map(e => `<li>${esc(e.name)}</li>`).join('')}</ul>` : ''}`;
  sec('continuity', 'Continuity notes', cont);

  if (opts.full) sec('manuscript', 'Manuscript', `<div class="b-ms">${S.book.chapters.map((c, ci) => { const cs = scenes.filter(sc => sc.chapterId === c.id); return cs.length ? `<div class="b-chapter">${ci + 1}. ${esc(c.title)}</div>` + cs.map(sc => `<h4>${esc(sc.title || 'Untitled')}</h4>${A[sc.id].paras.map(p => `<p>${esc(p.text)}</p>`).join('')}`).join('') : ''; }).join('')}</div>`);

  const counts = `${words.toLocaleString()} words · ${scenes.length} scenes · ${S.world.elements.filter(e => e.type === 'person').length} characters · ${S.world.elements.filter(e => e.type === 'place').length} locations`;
  const logline = opts.edit ? `<div style="margin-top:20px">${field('logline', 'Logline', 2)}</div>` : (b.logline ? `<p class="b-logline">${esc(b.logline)}</p>` : '');
  return `<div class="bible"><div class="b-cover"><p class="b-kicker">Series bible</p><h1>${esc(S.book.title || 'Untitled')}</h1><div class="b-meta">${counts} · ${esc(today)}</div>${logline}</div>
<p class="b-kicker">Contents</p><ol class="b-toc">${sections.map(x => `<li><a href="#b-${x.id}">${esc(x.title)}</a><span>${x.n}</span></li>`).join('')}</ol>
${sections.map(x => `<h2 id="b-${x.id}"><span>${String(x.n).padStart(2, '0')}</span>${esc(x.title)}</h2>${x.body}`).join('')}</div>`;
}
function bibleMarkdown(full) {
  const b = bibleData(); const K = storyKeys(); const scenes = sceneList(); const A = {}; scenes.forEach(sc => { A[sc.id] = analyze(sc); });
  const L = []; const appearsIn = id => scenes.filter(sc => A[sc.id].present.has(id));
  L.push(`# ${S.book.title || 'Untitled'}`, '', '*Series bible*', '');
  if (b.logline) L.push(`> ${b.logline}`, '');
  if (b.premise) L.push('## Premise', '', b.premise, '');
  if (b.tone) L.push('## Tone and style', '', b.tone, '');
  for (const [type, title] of TYPE_ORDER) {
    const els = S.world.elements.filter(e => e.type === type); if (!els.length) continue;
    L.push(`## ${title}`, '');
    for (const e of els) {
      L.push(`### ${e.name}`, ''); if (e.aliases?.length) L.push(`*Also: ${e.aliases.join(', ')}*`, '');
      if (e.summary) L.push(e.summary, ''); if (e.notes) L.push(`**Author's notes:** ${e.notes}`, '');
      if (b.arcs[e.id]) L.push(`**Arc:** ${b.arcs[e.id]}`, '');
      (S.world.media || []).filter(m => m.elIds.includes(e.id) && m.description).forEach(m => L.push(`**${type === 'person' ? 'Appearance' : 'Look'}${m.caption ? ' (' + m.caption + ')' : ''}:** ${m.description}`, ''));
      if ((e.traits || []).length) { L.push('| Kind | Trait | Applies |', '| --- | --- | --- |'); e.traits.forEach(t => L.push(`| ${KINDS[t.kind]} | ${t.name}${t.absent ? ' (cannot be present)' : ''} | ${t.from ? 'after ' + sceneLabel(t.from) : 'from the start'}${t.until ? ', until ' + sceneLabel(t.until) : ''} |`)); L.push(''); }
      const links = S.world.links.filter(l => l.a === e.id || l.b === e.id).map(l => { const A2 = elById(l.a), B2 = elById(l.b), D = elById(l.during); return A2 && B2 ? `- ${A2.name} *${l.rel}* ${B2.name}${D ? ' *during* ' + D.name : ''}` : ''; }).filter(Boolean);
      if (links.length) L.push('**Relationships**', '', ...links, '');
      const app = appearsIn(e.id); L.push(`**Appears in:** ${app.length ? app.map(sc => sceneLabel(sc.id)).join(' · ') : 'not yet in the manuscript (planned)'}`, '');
    }
  }
  L.push('## Timeline', '', '| Story date | Scene | Where | Who |', '| --- | --- | --- | --- |');
  [...scenes].sort((x, y) => cmpScenes(x.id, y.id, K)).forEach(sc => { const pr = [...A[sc.id].present].map(elById).filter(Boolean); const k = K[sc.id];
    L.push(`| ${sc.date ? fmtDate(sc.date) : k.key ? '≈ ' + fmtDate(k.key) : 'Undated'} | ${sceneLabel(sc.id)} | ${pr.filter(e => e.type === 'place').map(e => e.name).join(', ') || '–'} | ${pr.filter(e => e.type === 'person').map(e => e.name).join(', ') || '–'} |`); });
  L.push('', '## Chapter and scene breakdown', '');
  S.book.chapters.forEach((c, ci) => { const cs = scenes.filter(sc => sc.chapterId === c.id); if (!cs.length) return; L.push(`### ${ci + 1}. ${c.title}`, '');
    cs.forEach(sc => { L.push(`**${sc.title || 'Untitled'}** · ${sc.date ? fmtDate(sc.date) : 'Undated'}${sc.note ? ' · ' + sc.note : ''}`, '', sceneSynopsis(sc), '');
      const pr = [...A[sc.id].present].map(elById).filter(Boolean); if (pr.length) L.push(`*With:* ${pr.map(e => e.name).join(', ')}`, '');
      (S.world.media || []).filter(m => m.sceneId === sc.id && m.description).forEach(m => L.push(`*Image${m.caption ? ' (' + m.caption + ')' : ''}:* ${m.description}`, '')); }); });
  const open = ISSUES.filter(i => i.sev !== 'idea');
  L.push('## Continuity notes', ''); if (open.length) open.forEach(i => L.push(`- **${i.sev === 'error' ? 'Error' : 'Warning'}: ${i.title}**${i.scene ? ' (' + sceneLabel(i.scene) + ')' : ''}. ${i.detail || ''}`)); else L.push('No open continuity errors or warnings.'); L.push('');
  if (full) { L.push('## Manuscript', ''); S.book.chapters.forEach((c, ci) => { const cs = scenes.filter(sc => sc.chapterId === c.id); if (!cs.length) return; L.push(`### ${ci + 1}. ${c.title}`, ''); cs.forEach(sc => { L.push(`#### ${sc.title || 'Untitled'}`, ''); A[sc.id].paras.forEach(p => L.push(p.text, '')); }); }); }
  return L.join('\n');
}
let bibleImgs = new Map();
async function openBible() {
  flushEditor(); refreshIssues(true);
  $('#bibleWrap').hidden = false; $('#bibleState').textContent = 'Loading images…';
  renderBible();
  bibleImgs = new Map();
  for (const m of (S.world.media || [])) { const src = imgSrc(m); if (src) bibleImgs.set(m.id, src); }
  renderBible(); $('#bibleState').textContent = bibleData().at ? `Prepared ${new Date(bibleData().at).toLocaleDateString()}` : '';
}
function renderBible() {
  const st = $('.bible-scroll').scrollTop;
  $('#biblePage').innerHTML = bibleHTML({ edit: true, img: bibleImgs, full: $('#bibleFull').checked });
  $('.bible-scroll').scrollTop = st;
}
const bibleStyleEl = document.createElement('style'); bibleStyleEl.textContent = BIBLE_CSS; document.head.appendChild(bibleStyleEl);
$('#bibleBtn').addEventListener('click', openBible);
$('#bibleClose').addEventListener('click', () => { $('#bibleWrap').hidden = true; });
$('#bibleFull').addEventListener('change', renderBible);
$('#biblePage').addEventListener('input', e => { const k = e.target.dataset.bible; if (k) { bibleData()[k] = e.target.value; persistNovel(); } });
$('#biblePage').addEventListener('click', e => { const a = e.target.closest('a[href^="#b-"]'); if (a) { e.preventDefault(); const t = document.getElementById(a.getAttribute('href').slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth' }); } });
async function getDownloads() { try { return window.claude?.use ? await withTimeout(window.claude.use('downloads'), 10000) : null; } catch (e) { return null; } }
const fileBase = () => (S.book.title || 'Untitled').replace(/[\\/:*?"<>|]+/g, '').trim() + ' - Series Bible';
async function saveFile(filename, data) {
  const dl = await getDownloads(); if (!dl) { toast("Saving files isn't available in this view."); return; }
  try { await dl.save({ filename, data }); toast('Bible exported.'); }
  catch (e) { if (e?.code === 'declined') return; toast(e?.code === 'rate_limited' ? 'A save is already open. Try again in a moment.' : "Couldn't save the file here."); }
}
$('#bibleHtml').addEventListener('click', async () => {
  const btn = $('#bibleHtml'); btn.disabled = true; $('#bibleState').textContent = 'Embedding images…';
  const imgs = new Map(); for (const m of (S.world.media || [])) { const d = await imageDataUrl(m); if (d) imgs.set(m.id, d); }
  const body = bibleHTML({ edit: false, img: imgs, full: $('#bibleFull').checked });
  const doc = `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.book.title || 'Untitled')}: Series bible</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono&display=swap"><style>body{margin:0;background:#eceeed}.bible{max-width:860px;margin:24px auto;box-shadow:0 10px 40px rgba(0,0,0,.15)}@media print{body{background:#fff}.bible{margin:0;box-shadow:none}}${BIBLE_CSS}</style></head><body>${body}</body></html>`;
  $('#bibleState').textContent = ''; btn.disabled = false;
  await saveFile(fileBase() + '.html', doc);
});
$('#bibleMd').addEventListener('click', () => saveFile(fileBase() + '.md', bibleMarkdown($('#bibleFull').checked)));
$('#biblePrep').addEventListener('click', async () => {
  const sample = await getSample(); if (!sample) { toast("AI isn't available in this view."); return; }
  const btn = $('#biblePrep'); btn.disabled = true; $('#bibleState').textContent = 'Claude is reading the whole book…';
  const scenes = sceneList(); const chars = S.world.elements.filter(e => ['person', 'group'].includes(e.type));
  const prompt = `You are preparing a series bible for showrunners and screenwriters adapting a novel in progress. Use ONLY the story elements and manuscript below. Planned canon (author notes) may inform the premise but mark nothing as fact that the text contradicts.\n\nReturn only JSON:\n{"logline":"one sentence, max 35 words","premise":"one paragraph, 80 to 140 words: world, protagonist, central conflict, stakes","tone":"2 to 3 sentences on genre, tone, period and visual style","synopses":[{"id":"scene id","text":"2 to 3 sentences: what happens and what changes"}],"arcs":[{"id":"element id","text":"1 to 2 sentences: where they start, how they change so far, and what is unresolved"}]}\n\nScene ids: ${scenes.map(sc => `${sc.id} = ${sceneLabel(sc.id)}`).join('; ')}\nCharacter and group ids: ${chars.map(e => `${e.id} = ${e.name}`).join('; ') || '(none)'}\nWrite in the manuscript's language.\n\n${canonText()}\n\nMANUSCRIPT${manuscriptText(120000)}`;
  try {
    const r = await sample.json(prompt, { modelTier: 'default' }); const b = bibleData();
    if (r?.logline) b.logline = String(r.logline); if (r?.premise) b.premise = String(r.premise); if (r?.tone) b.tone = String(r.tone);
    (Array.isArray(r?.synopses) ? r.synopses : []).forEach(x => { if (x && S.scenes[x.id] && x.text) b.synopses[x.id] = String(x.text); });
    (Array.isArray(r?.arcs) ? r.arcs : []).forEach(x => { if (x && elById(x.id) && x.text) b.arcs[x.id] = String(x.text); });
    b.at = Date.now(); persistNovel(); renderBible(); $('#bibleState').textContent = 'Prepared just now. Edit anything before exporting.';
  } catch (e) { $('#bibleState').textContent = e?.code === 'not_granted' ? 'AI access was not allowed.' : e?.code === 'rate_limited' ? 'Too many AI requests. Try again in a minute.' : "Claude didn't finish. Try again."; }
  finally { btn.disabled = false; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#bibleWrap').hidden && !$('#confirmHost').innerHTML) $('#bibleWrap').hidden = true; });

/* ---------- design skins ---------- */
const SKINS = ['classic', 'typewriter', 'corkboard'];
function applySkin(s, remember) {
  if (!SKINS.includes(s)) s = 'classic';
  if (s === 'classic') delete document.documentElement.dataset.skin; else document.documentElement.dataset.skin = s;
  $('#skinSel').value = s;
  if (remember) { try { localStorage.setItem('storyworld.skin', s); } catch (e) {} try { history.replaceState(null, '', s === 'classic' ? location.pathname + location.search : '#' + s); } catch (e) {} }
}
$('#skinSel').addEventListener('change', e => applySkin(e.target.value, true));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (SKINS.includes(h)) applySkin(h, false); });
(() => { const h = location.hash.slice(1); let s = SKINS.includes(h) ? h : null; if (!s) { try { s = localStorage.getItem('storyworld.skin'); } catch (e) {} } applySkin(s || 'classic', false); })();

/* ---------- boot ---------- */
function start() {
  S.world.media = S.world.media || [];
  $('#bookTitle').value = S.book.title || '';
  cur = S.book.sceneOrder.find(id => S.scenes[id]) || null;
  if (!cur) { const st = blankStory(); S.book.chapters.push(...st.book.chapters); Object.assign(S.scenes, st.scenes); S.book.sceneOrder.push(...st.book.sceneOrder); cur = st.book.sceneOrder[0]; }
  if (isDemo) cur = 's4';
  renderBanner(); ISSUES = computeIssues(); renderIssueChip();
  const id = cur; cur = null; clearTimeout(syncTimer); syncTimer = null; openScene(id);
}
(async () => {
  S = sampleStory(); isDemo = true; ui.tab = 'issues'; start(); setStatus('Connecting…');
  await initStore();
  const data = await loadData();
  if (data && data.book && data.scenes) {
    S = { book: data.book, scenes: data.scenes, world: { elements: [], links: [], dismissed: {}, ...data.world } };
    Object.values(S.scenes).forEach(sc => { sc.html = cleanHTML(sc.html); });
    isDemo = false; anaCache.clear(); ui.tab = 'scene'; start(); setStatus(savedLabel());
  } else if (!isDemo) {
    persistAll().then(() => toast('Your copy of the sample is saved.'));
  } else {
    setStatus(store.mode === 'db' ? 'Sample story · not saved yet' : 'Sample story · saves in this browser');
  }
})();
})();
